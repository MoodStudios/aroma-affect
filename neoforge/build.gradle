plugins {
    id 'multiloader-loader'
    alias libs.plugins.modDevGradle
}

neoForge {
    version = libs.neoForge.get().version
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }

    // Parchment has no mapping for MC 26.2 yet — disabled on the 26.2 branch (dev-only param names).
    // parchment.parchmentArtifact = libs.parchment.get().toString()

    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }

        client {
            client()
        }

        server {
            server()
        }

        serverDev {
            server()
            gameDirectory = rootProject.file('run/neoforge/server')
        }

        clientDev1 {
            client()
            gameDirectory = rootProject.file('run/neoforge/client1')
            programArguments.addAll('--username', 'NeoForgeDev1')
        }

        clientDev2 {
            client()
            gameDirectory = rootProject.file('run/neoforge/client2')
            programArguments.addAll('--username', 'NeoForgeDev2')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

apply from: rootProject.file('repositories.gradle')
apply from: 'dependencies.gradle'

tasks.register('prepareMultiplayerDev') {
    group = 'neoforge'
    description = 'Prepares NeoForge dev server/client run directories for multiplayer testing.'

    doLast {
        def baseDir = rootProject.file('run/neoforge')
        def serverDir = new File(baseDir, 'server')
        def client1Dir = new File(baseDir, 'client1')
        def client2Dir = new File(baseDir, 'client2')

        serverDir.mkdirs()
        client1Dir.mkdirs()
        client2Dir.mkdirs()

        copy {
            from rootProject.file('dev/multiplayer/servers.neoforge.dat')
            into client1Dir
            rename { 'servers.dat' }
        }
        copy {
            from rootProject.file('dev/multiplayer/servers.neoforge.dat')
            into client2Dir
            rename { 'servers.dat' }
        }

        new File(serverDir, 'eula.txt').text = "eula=true${System.lineSeparator()}"
        new File(serverDir, 'server.properties').text = """\
server-port=25575
online-mode=false
enforce-secure-profile=false
motd=AromaCraft NeoForge Dev Server
pvp=false
allow-flight=true
view-distance=10
simulation-distance=8
""".stripIndent()

        def offlineUuid = { String name ->
            java.util.UUID.nameUUIDFromBytes(("OfflinePlayer:" + name).getBytes(java.nio.charset.StandardCharsets.UTF_8)).toString()
        }

        def opNames = ['NeoForgeDev1', 'NeoForgeDev2', 'FabricDev1', 'FabricDev2']
        def opsEntries = opNames.collect { name ->
            [
                uuid: offlineUuid(name),
                name: name,
                level: 4,
                bypassesPlayerLimit: false
            ]
        }
        new File(serverDir, 'ops.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(opsEntries))
    }
}
