pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri("https://maven.fabricmc.net")
                }
            }
            filter {
                includeGroupAndSubgroups("net.fabricmc")
                includeGroup("fabric-loom")
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge'
                    url = uri('https://repo.spongepowered.org/repository/maven-public')
                }
            }
            filter {
                includeGroupAndSubgroups("org.spongepowered")
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'NeoForge'
                    url = uri("https://maven.neoforged.net/releases")
                }
            }
            filter {
                includeGroupAndSubgroups("net.neoforged")
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    versionCatalogs {
        libs {
            version('minecraft', providers.gradleProperty('minecraft_version').get())
            version('neoForge', providers.gradleProperty('neoforge_version').get())
            version('neoForm', providers.gradleProperty('neoform_version').get())
            version('fabricApi', providers.gradleProperty('fabric_api_version').get())
            version('fabricLoader', providers.gradleProperty('fabric_loader_version').get())
            version('balm', providers.gradleProperty('balm_version').get())
            version('curios', providers.gradleProperty('curios_version').get())
        }
    }
}

rootProject.name = 'aromaaffect'

includeBuild('build-logic')
include('common')
if (include_fabric == "true") {
    include('fabric')
}
if (include_neoforge == "true") {
    include('neoforge')
}
